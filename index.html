<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: white;

        background:
            linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.5)),
            url("background.jpg") center / cover no-repeat;

        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    /* Dark glass overlay */
    #main {
        width: 95%;
        max-width: 1100px;
        text-align: center;
    }

    h1 {
        font-size: clamp(28px, 5vw, 55px);
        margin-bottom: 35px;
        text-shadow: 0 0 20px rgba(255,255,255,.35);
    }

    /* Countdown bar */
    #countdown {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: stretch;

        background: rgba(0,0,0,.55);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        border: 1px solid rgba(255,255,255,.15);
        border-radius: 20px;

        box-shadow:
            0 0 30px rgba(0,0,0,.5),
            inset 0 0 20px rgba(255,255,255,.03);

        overflow: hidden;
    }

    .unit {
        flex: 1;
        padding: 22px 10px;
        min-width: 0;
    }

    .unit:not(:last-child) {
        border-right: 1px solid rgba(255,255,255,.15);
    }

    .number {
        font-size: clamp(20px, 4vw, 42px);
        font-weight: bold;
        text-shadow: 0 0 15px rgba(255,255,255,.3);
    }

    .label {
        margin-top: 6px;
        font-size: clamp(9px, 1.5vw, 14px);
        opacity: .6;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* ENTER screen */
    #enterScreen {
        position: fixed;
        inset: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        background: rgba(0,0,0,.9);
        z-index: 1000;
    }

    #enterButton {
        padding: 18px 55px;
        font-size: 22px;
        font-weight: bold;

        color: white;
        background: rgba(255,255,255,.08);

        border: 1px solid rgba(255,255,255,.3);
        border-radius: 15px;

        cursor: pointer;

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        box-shadow: 0 0 30px rgba(255,255,255,.08);

        transition: .25s;
    }

    #enterButton:hover {
        transform: scale(1.05);
        background: rgba(255,255,255,.15);
        box-shadow: 0 0 40px rgba(255,255,255,.2);
    }

    /* Surprise button */
    #surpriseButton {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);

        padding: 12px 24px;

        color: white;
        background: rgba(0,0,0,.5);

        border: 1px solid rgba(255,255,255,.2);
        border-radius: 12px;

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        cursor: pointer;
        font-size: 15px;

        z-index: 100;
        transition: .25s;
    }

    #surpriseButton:hover {
        transform: translateX(-50%) scale(1.05);
        background: rgba(255,255,255,.12);
    }

    /* Surprise image */
    #surpriseImage {
        position: fixed;

        top: 75px;
        left: 50%;

        transform: translateX(-50%);

        max-width: 85vw;
        max-height: 65vh;

        object-fit: contain;

        border-radius: 15px;

        border: 1px solid rgba(255,255,255,.2);

        box-shadow:
            0 0 40px rgba(0,0,0,.8),
            0 0 20px rgba(255,255,255,.08);

        opacity: 0;
        pointer-events: none;

        transition: opacity .3s;

        z-index: 99;
    }

    #surpriseImage.show {
        opacity: 1;
    }

    /* Mobile */
    @media (max-width: 600px) {

        #countdown {
            border-radius: 14px;
        }

        .unit {
            padding: 15px 4px;
        }

        .number {
            font-size: 18px;
        }

        .label {
            font-size: 7px;
            letter-spacing: .5px;
        }

        h1 {
            margin-bottom: 25px;
        }
    }
</style>
</head>

<body>

<!-- ENTER SCREEN -->
<div id="enterScreen">
    <button id="enterButton">ENTER</button>
</div>

<!-- SURPRISE BUTTON -->
<button id="surpriseButton">Surprise me!</button>

<!-- RANDOM IMAGE -->
<img id="surpriseImage" src="" alt="Surprise image">

<!-- MAIN CONTENT -->
<div id="main">

    <h1>Countdown</h1>

    <div id="countdown">

        <div class="unit">
            <div class="number" id="years">0</div>
            <div class="label">Years</div>
        </div>

        <div class="unit">
            <div class="number" id="months">0</div>
            <div class="label">Months</div>
        </div>

        <div class="unit">
            <div class="number" id="weeks">0</div>
            <div class="label">Weeks</div>
        </div>

        <div class="unit">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="unit">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="unit">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="unit">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>

    </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
    <source src="videoplayback.m4a" type="audio/mp4">
</audio>

<script>

    /* =========================
       COUNTDOWN
    ========================= */

    const target = new Date("March 4, 2028 00:00:00");

    function updateCountdown() {

        const now = new Date();
        let difference = target - now;

        if (difference <= 0) {
            document.getElementById("years").textContent = "0";
            document.getElementById("months").textContent = "0";
            document.getElementById("weeks").textContent = "0";
            document.getElementById("days").textContent = "0";
            document.getElementById("hours").textContent = "0";
            document.getElementById("minutes").textContent = "0";
            document.getElementById("seconds").textContent = "0";
            return;
        }

        const secondsTotal = Math.floor(difference / 1000);

        const seconds = secondsTotal % 60;
        const minutes = Math.floor(secondsTotal / 60) % 60;
        const hours = Math.floor(secondsTotal / 3600) % 24;

        const totalDays = Math.floor(secondsTotal / 86400);

        const years = Math.floor(totalDays / 365);
        const remainingDaysAfterYears = totalDays % 365;

        const months = Math.floor(remainingDaysAfterYears / 30);
        const remainingDays = remainingDaysAfterYears % 30;

        const weeks = Math.floor(remainingDays / 7);
        const days = remainingDays % 7;

        document.getElementById("years").textContent = years;
        document.getElementById("months").textContent = months;
        document.getElementById("weeks").textContent = weeks;
        document.getElementById("days").textContent = days;

        document.getElementById("hours").textContent =
            String(hours).padStart(2, "0");

        document.getElementById("minutes").textContent =
            String(minutes).padStart(2, "0");

        document.getElementById("seconds").textContent =
            String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);


    /* =========================
       MUSIC / ENTER BUTTON
    ========================= */

    const enterScreen = document.getElementById("enterScreen");
    const enterButton = document.getElementById("enterButton");
    const music = document.getElementById("music");

    enterButton.addEventListener("click", () => {

        music.play().catch(error => {
            console.log("Music could not start:", error);
        });

        enterScreen.style.display = "none";
    });


    /* =========================
       SURPRISE IMAGE POOL
    ========================= */

    const imagePool = [
        "images/2173.jpg",
        "images/2176.jpg",
        "images/6410-2.jpg",
        "images/6413-2.jpg",
        "images/6414-1.jpg",
        "images/6415-1.jpg",
        "images/666.png",
        "images/67.jpg"
    ];

    const surpriseButton = document.getElementById("surpriseButton");
    const surpriseImage = document.getElementById("surpriseImage");

    surpriseButton.addEventListener("click", () => {

        const randomIndex =
            Math.floor(Math.random() * imagePool.length);

        surpriseImage.src = imagePool[randomIndex];

        surpriseImage.classList.add("show");
    });

</script>

</body>
</html>
